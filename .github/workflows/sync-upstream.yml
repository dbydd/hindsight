name: Sync upstream

# Keep this fork current with the upstream default branch.
#
# The fork exists to carry two local patches on a side branch (see the repository
# description and `patches/README.md`); it is not meant to diverge on `main`. This job
# syncs `main` with upstream on a schedule so the patch branch can be rebased onto a
# recent tag without a long merge.
#
# The sync runs through GitHub's own "merge-upstream" endpoint rather than a local git
# push. That endpoint is executed by GitHub, so it needs only `contents: write` and is
# not subject to the restriction that blocks a workflow token from pushing changes to
# `.github/workflows/*` (which upstream edits regularly). A local push would be rejected
# with "refusing to allow a GitHub App to create or update workflow ... without workflows
# permission".
#
# The endpoint merges upstream into `main`, keeping this workflow file's commit. GitHub
# refuses the merge (409/422) instead of discarding anything, so real local work on `main`
# cannot be silently overwritten: it surfaces as a failed run for a human to reconcile.
#
# The patch branch is deliberately not touched: a patch must match its base tag exactly,
# so it is rebased by hand (patches/README.md documents the pass).

on:
  schedule:
    # 04:17 UTC daily — off the hour to avoid the scheduler's peak.
    - cron: "17 4 * * *"
  workflow_dispatch:
  # Also sync right after someone pushes to main, so a hand-rebased patch branch does not
  # sit on a stale base waiting for the next cron.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upstream_sha="$(gh api repos/vectorize-io/hindsight/commits/main --jq .sha)"
          fork_sha="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          echo "upstream main: ${upstream_sha}"
          echo "fork main    : ${fork_sha}"

          if [ "${upstream_sha}" = "${fork_sha}" ]; then
            echo "Already up to date."
            exit 0
          fi

          # The endpoint reports merge_type=fast-forward when the fork had no local
          # commits, and merge when it did (this workflow's own commit).
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main 2>&1)" || {
            echo "::error::merge-upstream failed; main may have diverged and needs a manual reconcile."
            echo "${response}"
            exit 1
          }
          echo "${response}"

          new_sha="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          echo "main is now at ${new_sha}."
